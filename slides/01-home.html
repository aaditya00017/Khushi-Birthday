<section id="home" class="screen ref-home">
<div class="ref-wrapper">
    <div class="ref_flag__birthday">
      <img src="images/1.png" alt="" width="350" class="ref_flag__left">
      <img src="images/1.png" alt="" width="350" class="ref_flag__right">
    </div>

    <div class="ref_content">
      <div class="ref_left">
        <div class="ref_title">
          <h1 class="ref_happy">
            <span style="--t: 4s;">H</span>
            <span style="--t: 4.2s;">a</span>
            <span style="--t: 4.4s;">p</span>
            <span style="--t: 4.6s;">p</span>
            <span style="--t: 4.8s;">y</span>
          </h1>
          <h1 class="ref_birthday">
            <span style="--t: 5s;">B</span>
            <span style="--t: 5.2s;">i</span>
            <span style="--t: 5.4s;">r</span>
            <span style="--t: 5.6s;">t</span>
            <span style="--t: 5.8s;">h</span>
            <span style="--t: 6s;">d</span>
            <span style="--t: 6.2s;">a</span>
            <span style="--t: 6.4s;">y</span>
          </h1>
          <div class="ref_hat">
            <img src="images/hat.png" alt="" width="130">
          </div>
        </div>

        <div class="ref_date__of__birth"><span>24 September</span></div>

        <div class="ref_btn ref-flow-button">
          <button id="ref_btn__letter" type="button" onclick="showSection('personalVideo')">
            Click here 
            <i class="fa-regular fa-envelope"></i>
          </button>
        </div>
      </div>

      <div class="ref_right">
        <div class="ref_box__account">
          <div class="ref_image"> 
  <img src="images/khushi.jpg" alt="Khushi"> 
</div>
          <div class="ref_name">
            <i class="fa-solid fa-heart"></i>
            <span>Khushi</span>
            <i class="fa-solid fa-heart"></i>
          </div>
          <div class="ref_balloon_one">
            <img width="100px" src="images/balloon1.png" alt="">
          </div>
          <div class="ref_balloon_two">
            <img width="100px" src="images/balloon2.png" alt="">
          </div>
        </div>

        <div class="ref_cricle">
          <div class="ref_text__cricle">
            <span style="--i: 1;">h</span>
            <span style="--i: 2;">a</span>
            <span style="--i: 3;">p</span>
            <span style="--i: 4;">p</span>
            <span style="--i: 5;">y</span>
            <span style="--i: 6;">-</span>
            <span style="--i: 7;">b</span>
            <span style="--i: 8;">i</span>
            <span style="--i: 9;">r</span>
            <span style="--i: 10;">t</span>
            <span style="--i: 11;">h</span>
            <span style="--i: 12;">d</span>
            <span style="--i: 13;">a</span>
            <span style="--i: 14;">y</span>
            <span style="--i: 15;">-</span>
          </div>
          <i class="fa-solid fa-heart"></i>
        </div>
      </div>
    </div>

    <div class="ref_decorate_star star1" style="--t: 15s;"></div>
    <div class="ref_decorate_star star2" style="--t: 15.2s;"></div>
    <div class="ref_decorate_star star3" style="--t: 15.4s;"></div>
    <div class="ref_decorate_star star4" style="--t: 15.6s;"></div>
    <div class="ref_decorate_star star5" style="--t: 15.8s;"></div>

    <div class="ref_decorate_flower--one" style="--t: 15s;">
      <img width="20" src="images/decorate_flower.png" alt="">
    </div>
    <div class="ref_decorate_flower--two" style="--t: 15.3s;">
      <img width="20" src="images/decorate_flower.png" alt="">
    </div>
    <div class="ref_decorate_flower--three" style="--t: 15.6s;">
      <img width="20" src="images/decorate_flower.png" alt="">
    </div>

    <div class="ref_decorate_bottom">
      <img src="images/decorate.png" alt="" width="100">
    </div>
    <div class="ref_smiley__icon">
      <img src="images/smiley_icon.png" alt="" width="100">
    </div>
</section>
